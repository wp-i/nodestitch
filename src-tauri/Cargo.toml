[package]
name = "nodestitch"
version = "0.1.0"
description = "一款纯本地、轻量克制的 Windows 桌面时间线任务规划工具"
authors = ["Nodestitch contributors"]
edition = "2024"

[lib]
name = "nodestitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
